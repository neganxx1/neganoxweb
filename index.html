    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #fff;
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      .font-brand { font-family: 'Cinzel Decorative', serif; }
      .font-tech { font-family: 'Orbitron', sans-serif; }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #050505; }
      ::-webkit-scrollbar-thumb { background: #8b0000; }

      .custom-cursor {
        width: 12px;
        height: 12px;
        background: #ff0000;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.15s ease-out;
      }
      .cursor-glow {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(139, 0, 0, 0.5);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9998;
        transition: all 0.25s ease-out;
      }
      
      .text-glow-red {
        text-shadow: 0 0 10px rgba(139, 0, 0, 0.8), 0 0 20px rgba(139, 0, 0, 0.4);
      }
    </style>
